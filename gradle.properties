# Minimum compatible jsyn-natives-* version. Bump only when jsyn adds JNI
# calls that require a newer compiled native from synauson/synauson.
# jsyn's own version (JSYN_VERSION env var or 1.0.0-SNAPSHOT) is independent.
#
# Pinned to 1.0.0-SNAPSHOT rather than the 1.0.0 release: the published
# 1.0.0 release of jsyn-natives-linux was compiled on synauson's old
# self-hosted CI runner (before the 2026-08-05 migration to GitHub-hosted
# runners) and links against GLIBC_2.43 — a symbol version not present on
# stock Ubuntu 24.04 (which ships 2.39), so it fails to load with
# UnsatisfiedLinkError anywhere except that specific old runner's host.
# Builds published since the migration (synauson-server's java-linux job,
# now on ubuntu-24.04) top out at GLIBC_2.34 and load cleanly everywhere.
# Repin to a new 1.0.0 (or later) release once one is cut from the
# hosted-runner pipeline.
jsynNativesVersion=1.0.0-SNAPSHOT
