name: ci

# Pull requests are disabled on this repository. Every branch push runs CI, and
# main only moves to a commit whose checks passed (enforced by a ruleset).
on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  # -------------------------------------------------------------------------
  # Agent docs (CLAUDE.md) against the repository: paths, Gradle tasks and
  # env vars it names, and its size. tools/check-agent-docs.py is a copy of
  # the synauson repo's.
  # -------------------------------------------------------------------------
  agent-docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check agent docs
        env:
          AGENT_DOCS_DENY: ${{ secrets.AGENT_DOCS_DENY }}
        run: python3 tools/check-agent-docs.py --github

  # -------------------------------------------------------------------------
  # Compile pure-Java sources to catch API regressions without needing the
  # native platform JARs, and check the README's code blocks match the test
  # sources they are copied from (checkReadmeSnippets in jsyn/build.gradle.kts).
  # Test compilation needs jsyn-natives-linux on the test classpath; it
  # resolves from the public Synauson Maven repository.
  # -------------------------------------------------------------------------
  java-compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Temurin 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      # test-linux's Gradle cache (a superset of what this job needs),
      # restored but never saved: one entry instead of three.
      - name: Restore Gradle wrapper + caches
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-test-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-test-

      - name: compile jsyn sources and tests, check README snippets
        run: ./gradlew :jsyn:compileJava :jsyn:compileTestJava :jsyn:checkReadmeSnippets --no-daemon --console=plain

  # -------------------------------------------------------------------------
  # Run the full IT suite (VAD and turn-detection model inference, SIP, WebRTC,
  # recording, DTMF, native-participant lifecycle) against the JNI boundary
  # on Linux. Checks out the sibling synauson repo for models/*.onnx and
  # the short_speech.wav fixture — jsyn itself ships neither.
  # -------------------------------------------------------------------------
  test-linux:
    runs-on: ubuntu-24.04
    needs: java-compile
    timeout-minutes: 30
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
      PLAYWRIGHT_SKIP_VALIDATE_HOST_REQUIREMENTS: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Checkout synauson (models + fixtures)
        uses: actions/checkout@v4
        with:
          repository: synauson/synauson
          # synauson/synauson is private; this deploy key can only read it.
          ssh-key: ${{ secrets.SYNAUSON_DEPLOY_KEY }}
          path: synauson-repo

      # The checkout starts without models/; the fetch below downloads only
      # files that are missing or don't match (the STT encoder is 650 MB).
      - name: Cache synauson's model files
        uses: actions/cache@v4
        with:
          path: synauson-repo/models
          key: ${{ runner.os }}-models-${{ hashFiles('synauson-repo/tools/models-fetch/manifest.tsv') }}

      # synauson's model files live in a private bucket, and synauson ships a
      # dependency-free script to fetch them. A synauson that still keeps the
      # models in git has no script, and this step does nothing there.
      - name: Fetch models into the synauson checkout
        shell: bash
        env:
          SYNAUSON_MODELS_ACCESS_KEY_ID: ${{ secrets.SYNAUSON_MODELS_ACCESS_KEY_ID }}
          SYNAUSON_MODELS_SECRET_ACCESS_KEY: ${{ secrets.SYNAUSON_MODELS_SECRET_ACCESS_KEY }}
          SYNAUSON_MODELS_ENDPOINT: ${{ secrets.SYNAUSON_MODELS_ENDPOINT }}
        run: |
          script=synauson-repo/tools/models-fetch/fetch-models.sh
          echo "curl: $(command -v curl), $(curl --version | sed -n 1p)"
          if [ ! -f "$script" ]; then
            echo "no $script in this synauson checkout; models come from git"
            exit 0
          fi
          sh "$script" synauson-repo/models

      - name: Install GStreamer runtime packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgstreamer1.0-0 \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly \
            gstreamer1.0-libav \
            gstreamer1.0-nice

      - name: Install ONNX Runtime 1.24.4
        run: |
          curl -fsSL -o /tmp/ort.tgz \
            "https://github.com/microsoft/onnxruntime/releases/download/v1.24.4/onnxruntime-linux-x64-1.24.4.tgz"
          sudo tar -xzf /tmp/ort.tgz -C /opt/
          sudo mv /opt/onnxruntime-linux-x64-1.24.4 /opt/onnxruntime
          sudo ln -sf /opt/onnxruntime/lib/libonnxruntime.so.1.24.4 /usr/lib/libonnxruntime.so

      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: ${{ runner.os }}-playwright-chromium-1.47.0

      - name: Set up Temurin 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Cache Gradle wrapper + caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-test-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-test-

      - name: Install Playwright Chromium
        env:
          INSTALL_PLAYWRIGHT_DEPS: "1"
        run: ./gradlew :jsyn:installPlaywrightBrowsers --no-daemon --console=plain

      - name: gradle :jsyn:test
        env:
          # The natives need a license key: a test license with every capability.
          SYNAUSON_LICENSE_KEY: ${{ secrets.SYNAUSON_LICENSE_KEY }}
        run: |
          ./gradlew :jsyn:test --no-daemon --console=plain \
            -DsynausonRepoDir="${{ github.workspace }}/synauson-repo"

      # Artifacts are awkward to fetch from automation; put the failing
      # classes' JUnit XML (stack traces, suppressed exceptions, captured
      # stdout/stderr) straight into the job log.
      - name: Print failing test reports
        if: failure()
        run: grep -l -E '<(failure|error) ' jsyn/build/test-results/test/*.xml | xargs -r cat

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-linux
          path: |
            jsyn/build/test-results/test/*.xml
            jsyn/build/reports/tests/test/
          retention-days: 14

  # -------------------------------------------------------------------------
  # Same IT suite as test-linux, on Windows. Uses only the GStreamer runtime
  # MSI (not the devel MSI): jsyn doesn't compile anything, it only needs
  # the runtime to exist so the pre-built native library can load. The
  # runner is a fresh GitHub-hosted VM, so models, the GStreamer installer,
  # Chromium and Gradle's caches come from the Actions cache.
  # -------------------------------------------------------------------------
  test-windows:
    runs-on: windows-2025
    needs: java-compile
    timeout-minutes: 60
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}\.playwright-browsers
      GST_VERSION: "1.26.7"
      ORT_VERSION: "1.24.4"
    steps:
      - uses: actions/checkout@v4

      - name: Checkout synauson (models + fixtures)
        uses: actions/checkout@v4
        with:
          repository: synauson/synauson
          # synauson/synauson is private; this deploy key can only read it.
          ssh-key: ${{ secrets.SYNAUSON_DEPLOY_KEY }}
          path: synauson-repo

      # See the matching steps in test-linux.
      - name: Cache synauson's model files
        uses: actions/cache@v4
        with:
          path: synauson-repo/models
          key: ${{ runner.os }}-models-${{ hashFiles('synauson-repo/tools/models-fetch/manifest.tsv') }}

      - name: Fetch models into the synauson checkout
        shell: bash
        env:
          SYNAUSON_MODELS_ACCESS_KEY_ID: ${{ secrets.SYNAUSON_MODELS_ACCESS_KEY_ID }}
          SYNAUSON_MODELS_SECRET_ACCESS_KEY: ${{ secrets.SYNAUSON_MODELS_SECRET_ACCESS_KEY }}
          SYNAUSON_MODELS_ENDPOINT: ${{ secrets.SYNAUSON_MODELS_ENDPOINT }}
        run: |
          script=synauson-repo/tools/models-fetch/fetch-models.sh
          echo "curl: $(command -v curl), $(curl --version | sed -n 1p)"
          if [ ! -f "$script" ]; then
            echo "no $script in this synauson checkout; models come from git"
            exit 0
          fi
          sh "$script" synauson-repo/models

      - name: Cache the GStreamer installer
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\gstreamer-msi
          key: ${{ runner.os }}-gstreamer-msi-${{ env.GST_VERSION }}

      - name: Install GStreamer runtime + ONNX Runtime
        shell: pwsh
        run: |
          $dl = Join-Path $env:RUNNER_TEMP 'gstreamer-msi'
          New-Item -ItemType Directory -Force -Path $dl | Out-Null
          $name = "gstreamer-1.0-msvc-x86_64-$env:GST_VERSION.msi"
          $msi = Join-Path $dl $name
          if (-not (Test-Path $msi)) {
            Invoke-WebRequest -Uri "https://gstreamer.freedesktop.org/data/pkg/windows/$env:GST_VERSION/msvc/$name" -OutFile "$msi.part"
            Move-Item -Force "$msi.part" $msi
          }
          $sw = [Diagnostics.Stopwatch]::StartNew()
          $log = Join-Path $env:RUNNER_TEMP "$name.log"
          $proc = Start-Process msiexec.exe -Wait -PassThru -ArgumentList @(
            '/i', $msi, '/quiet', '/norestart', '/l*v', $log, 'ADDLOCAL=ALL', 'INSTALLDIR=C:\gstreamer\')
          if ($proc.ExitCode -ne 0) {
            if (Test-Path $log) { Get-Content $log -Tail 40 }
            throw "msiexec failed with exit code $($proc.ExitCode)"
          }
          Write-Host "GStreamer installed in $($sw.Elapsed.TotalSeconds) s"
          "C:\gstreamer\1.0\msvc_x86_64\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          $zip = Join-Path $env:RUNNER_TEMP 'ort.zip'
          Invoke-WebRequest -Uri "https://github.com/microsoft/onnxruntime/releases/download/v$env:ORT_VERSION/onnxruntime-win-x64-$env:ORT_VERSION.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath C:\ort -Force
          "C:\ort\onnxruntime-win-x64-$env:ORT_VERSION\lib" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      # The first gst_init() for a user scans every installed plugin through
      # gst-plugin-scanner and caches the result under %LOCALAPPDATA%\gstreamer-1.0
      # (ensure_current_registry in gstreamer/gst/gstregistry.c). On a fresh
      # runner that takes 7-44 s (DirectShow, Media Foundation and D3D11
      # plugins probe devices at load), and without this step it lands inside
      # whichever IT constructs JSyn first and blows its @Timeout.
      - name: Build GStreamer plugin registry
        shell: pwsh
        run: |
          $sw = [Diagnostics.Stopwatch]::StartNew()
          gst-inspect-1.0.exe coreelements | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "gst-inspect-1.0 failed: $LASTEXITCODE" }
          Write-Host "GStreamer registry built in $($sw.Elapsed.TotalSeconds) s"

      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: ${{ runner.os }}-playwright-chromium-1.47.0

      - name: Set up Temurin 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Cache Gradle wrapper + caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-test-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-test-

      - name: Install Playwright Chromium
        shell: pwsh
        run: ./gradlew.bat :jsyn:installPlaywrightBrowsers --no-daemon --console=plain

      - name: gradle :jsyn:test
        env:
          # The natives need a license key: a test license with every capability.
          SYNAUSON_LICENSE_KEY: ${{ secrets.SYNAUSON_LICENSE_KEY }}
        shell: pwsh
        run: |
          ./gradlew.bat :jsyn:test --no-daemon --console=plain `
            "-DsynausonRepoDir=${{ github.workspace }}\synauson-repo"

      # See the matching step in test-linux.
      - name: Print failing test reports
        if: failure()
        shell: pwsh
        run: |
          Get-ChildItem jsyn/build/test-results/test/*.xml |
            Where-Object { Select-String -Path $_ -Pattern '<(failure|error) ' -Quiet } |
            ForEach-Object { Get-Content $_ }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-windows
          path: |
            jsyn/build/test-results/test/*.xml
            jsyn/build/reports/tests/test/
          retention-days: 14

  # -------------------------------------------------------------------------
  # Publish the snapshot version set in build.gradle.kts (the minor after the
  # latest v* tag) to the Synauson Maven repository on every push to main.
  # This gives the examples testbed a stable, always-current snapshot to pull
  # without coordinating timestamp-based version strings across repos.
  # Other branches do not publish.
  # -------------------------------------------------------------------------
  publish-snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [java-compile, test-linux, test-windows]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Temurin 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      # test-linux's Gradle cache, restored but never saved (see java-compile).
      - name: Restore Gradle wrapper + caches
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-test-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-test-

      - name: publish jsyn snapshot
        env:
          R2_PUBLISH_ENDPOINT: ${{ secrets.R2_PUBLISH_ENDPOINT }}
          R2_PUBLISH_ACCESS_KEY_ID: ${{ secrets.R2_PUBLISH_ACCESS_KEY_ID }}
          R2_PUBLISH_SECRET_ACCESS_KEY: ${{ secrets.R2_PUBLISH_SECRET_ACCESS_KEY }}
        run: |
          ./gradlew :jsyn:publishLibraryPublicationToSynausonRepository --no-daemon --console=plain \
            "-Dorg.gradle.s3.endpoint=$R2_PUBLISH_ENDPOINT"
