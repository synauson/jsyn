name: release

on:
  push:
    tags:
      - 'v*'

jobs:
  # -------------------------------------------------------------------------
  # Publish com.synauson:jsyn:<version> to the Synauson Maven repository. The
  # version comes from the pushed tag (v1.0.0 → 1.0.0) via the JSYN_VERSION env
  # var read by build.gradle.kts; without MAVEN_RELEASES_URL the publish fails.
  # -------------------------------------------------------------------------
  publish:
    runs-on: gh-runner-l
    steps:
      - uses: actions/checkout@v4

      - name: Set up Temurin 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Cache Gradle wrapper + caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-release-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-release-

      - name: Compute version from tag
        id: version
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Publishing version: $VERSION"

      - name: publish jsyn
        env:
          JSYN_VERSION: ${{ steps.version.outputs.version }}
          MAVEN_RELEASES_URL: ${{ secrets.MAVEN_RELEASES_URL }}
          MAVEN_USER: ${{ secrets.MAVEN_USER }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
        run: ./gradlew :jsyn:publishLibraryPublicationToSynausonRepository --no-daemon --console=plain
